<style>
* { box-sizing: border-box }
body { margin: 0; background: #f4f6f3; color: #193d3b; font: 15px/1.55 system-ui, sans-serif }
header, main { width: min(100%, 1440px); margin-inline: auto; padding-inline: clamp(12px, 2vw, 32px) }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 18px }
h1 { margin: 0 auto 0 0; font-size: 22px; line-height: 1.25 }
.draft { display: block; margin-top: 4px; font-size: 12px; color: #526760; font-weight: 500 }
input, select, button { max-width: 100%; min-width: 0; font: inherit; color: inherit; border: 1px solid #bfcfc6; background: white; border-radius: 6px; padding: 6px 10px }
button { cursor: pointer }
a { color: #185c50 }
main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(380px, 1fr); align-items: start; gap: 24px; padding-bottom: 24px }
#canvas, aside { min-width: 0; background: white; border: 1px solid #d4dfd6; border-radius: 10px }
#canvas svg { display: block; width: 100%; height: auto; border-radius: inherit }
aside { padding: clamp(16px, 2vw, 28px); line-height: 1.65; overflow-wrap: anywhere }
aside h2 { margin: 0 0 10px; font-size: 18px }
aside h3 { margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid #d4dfd6; font-size: 16px }
aside h4 { margin: 14px 0 3px }
aside p { margin: 4px 0 12px }
aside button { margin: 2px 4px 2px 0; font-size: 14px }
aside details { margin-top: 18px; border-top: 1px solid #d4dfd6 }
aside summary { padding: 14px 0; font-weight: 650; cursor: pointer }
.field-entry { padding: 12px 0; border-top: 1px solid #e4eae5 }
.field-entry h4 { margin: 0; font: 600 15px/1.6 ui-monospace, monospace }
.field-entry p { margin: 6px 0 0 }
.field-entry small { color: #526760 }
.column-pair { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; padding: 5px 0; align-items: baseline }
.column-pair code { font-size: .9em }
.relation-detail { padding: 10px 0 }
.relation-detail + .relation-detail { border-top: 1px solid #e4eae5 }
#compact { display: none }
:focus-visible { outline: 2px solid #14755a; outline-offset: 2px }
@media (max-width: 1080px) {
 main { grid-template-columns: minmax(0,1fr) }
 header { gap: 8px }
 h1 { flex-basis: 100% }
}
@media (max-width: 640px) {
 header { display: grid; grid-template-columns: minmax(0,1fr) auto }
 h1, #search { grid-column: 1 / -1 }
 header a { justify-self: start }
 #canvas svg { display: none }
 #compact { display: grid; padding: 14px }
 #compact h2 { font-size: 18px; margin: 0 0 8px }
 .relation-row { padding: 10px 0; border-top: 1px solid #dde6e0 }
 .relation-row button { text-align: left; overflow-wrap: anywhere }
 .relation-row > button { display: block; border: none; padding: 0; font-weight: 650 }
 .relation-row small { display: block; overflow-wrap: anywhere; color: #53685c }
 .targets { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 13px }
 .targets button { padding: 4px 8px; background: #eff6f1 }
}
</style>

<script type="application/json" id="schema-data">{"tables": [{"name": "knowledge_bases", "title": "專案知識庫", "purpose": "以穩定 project_id 識別專案；名稱可變，成員表決定可讀文件與有效索引。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["project_id", "text", "UNIQUE · NOT NULL", "外部專案穩定識別；沒有跨資料庫 FK"], ["project_name", "text", "NOT NULL", "顯示名稱；不是唯一鍵"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"], ["updated_at", "timestamptz", "NOT NULL · DEFAULT now()", "更新時間；後續更新由寫入端維護"]], "rules": ["UNIQUE(project_id)；專案改名不改變 identity。", "文件內容可跨 knowledge_base 共用；讀取範圍由 knowledge_base_documents 管理。"]}, {"name": "documents", "title": "共用文件身分", "purpose": "來源定位決定文件身分；內容版本與索引產物分表管理。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["source_type", "text", "NOT NULL · CHECK", "repository / obsidian"], ["source_key", "text", "NOT NULL · CHECK length > 0", "來源命名空間"], ["source_path", "text", "NOT NULL · CHECK length > 0", "來源內相對路徑"], ["current_title", "text", "NULL", "目前文件標題"], ["unreferenced_since", "timestamptz", "NULL", "進入無引用狀態的時間；供清理流程使用"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"]], "rules": ["UNIQUE(source_type, source_key, source_path)；migration 另有 UNIQUE(id)，與主鍵重疊。", "documents 不直接持有 knowledge_base_id；成員表承接多對多關係。"]}, {"name": "document_revisions", "title": "不可變內容版本", "purpose": "保存文件內容快照；同文件相同內容雜湊共用 revision。不可變性由應用流程維護，migration 未建立禁止更新 trigger。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["document_id", "uuid", "NOT NULL · FK", "所屬 documents.id"], ["content_sha256", "char(64)", "NOT NULL · CHECK", "64 位小寫十六進位內容雜湊"], ["title", "text", "NULL", "此內容版本的標題"], ["content", "text", "NOT NULL", "完整來源文字"], ["captured_at", "timestamptz", "NOT NULL · DEFAULT now()", "來源快照取得時間"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"]], "rules": ["UNIQUE(document_id, content_sha256)；UNIQUE(document_id, id) 支援索引的複合 FK。"]}, {"name": "document_indexes", "title": "內容索引版本", "purpose": "以 revision 與 pipeline_hash 定位可共用的索引產物；一個產物包含 chunks 與 document_relations。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["document_id", "uuid", "NOT NULL · 複合 FK", "與 revision_id 一起限制相同文件"], ["revision_id", "uuid", "NOT NULL · 複合 FK", "來源內容版本"], ["pipeline_hash", "char(64)", "NOT NULL · CHECK", "64 位小寫十六進位 pipeline 雜湊"], ["chunking_model", "text", "NOT NULL", "切塊模型版本"], ["chunking_profile", "text", "NOT NULL", "切塊設定版本"], ["embedding_model", "text", "NOT NULL", "向量模型版本"], ["embedding_dimensions", "integer", "NOT NULL · CHECK = 384", "目前 schema 固定 384 維"], ["embedding_profile", "text", "NOT NULL", "向量設定版本"], ["lexical_profile", "text", "NOT NULL", "全文檢索設定版本"], ["relation_profile", "text", "NOT NULL", "關聯抽取設定版本"], ["status", "text", "NOT NULL · CHECK", "building / ready / failed / deleting"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"], ["ready_at", "timestamptz", "NULL · CHECK", "ready 或 deleting 必須有值；其他狀態必須 NULL"], ["unreferenced_since", "timestamptz", "NULL", "進入無引用狀態的時間；供清理流程使用"]], "rules": ["UNIQUE(revision_id, pipeline_hash)；UNIQUE(document_id, id) 支援同文件 FK。", "FK(document_id, revision_id) → document_revisions(document_id, id)。", "CHECK ((status IN (ready, deleting)) = (ready_at IS NOT NULL))。"]}, {"name": "knowledge_base_documents", "title": "專案文件成員與讀取角色", "purpose": "連接專案與共用文件；每個成員保存自己目前啟用的索引與最新請求世代。", "fields": [["knowledge_base_id", "uuid", "PK · NOT NULL · FK", "所屬 knowledge_bases.id"], ["document_id", "uuid", "PK · NOT NULL · FK", "共用 documents.id"], ["active_document_index_id", "uuid", "NULL · 複合 FK", "同文件的有效索引；尚未啟用可為 NULL"], ["requested_generation", "bigint", "NOT NULL · DEFAULT 0 · CHECK ≥ 0", "最新請求世代，用於拒絕過時結果"], ["is_entry", "boolean", "NOT NULL · DEFAULT false", "是否作為專案入口文件"], ["always_include_full_content", "boolean", "NOT NULL · DEFAULT false", "讀取時是否附加完整內容"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"], ["updated_at", "timestamptz", "NOT NULL · DEFAULT now()", "更新時間；後續更新由寫入端維護"]], "rules": ["PRIMARY KEY(knowledge_base_id, document_id)。", "FK(document_id, active_document_index_id) → document_indexes(document_id, id)；FK 不檢查 ready 狀態，啟用資格由流程驗證。", "idx_kbd_document(document_id, knowledge_base_id)。", "idx_kbd_active_index(active_document_index_id) WHERE active_document_index_id IS NOT NULL。", "created_at 由 migration 定義並預設 now()；目前 KnowledgeBaseDocumentModel 未映射此欄，省略寫入仍由資料庫填值。"]}, {"name": "chunks", "title": "索引切塊與檢索資料", "purpose": "每個切塊屬於一個 document_index；來源座標與標題路徑支援檢索證據回溯。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["document_index_id", "uuid", "NOT NULL · FK", "所屬 document_indexes.id"], ["ordinal", "integer", "NOT NULL · CHECK ≥ 0", "索引內的切塊順序"], ["heading_path", "text[]", "NOT NULL · DEFAULT {}", "來源標題階層"], ["content", "text", "NOT NULL", "切塊文字"], ["block_start", "integer", "NOT NULL · CHECK ≥ 0", "來源範圍起點，歷史欄位名稱保留"], ["block_end", "integer", "NOT NULL · CHECK > block_start", "來源範圍終點，不包含終點"], ["token_count", "integer", "NULL · CHECK ≥ 0", "可選的 token 數量"], ["embedding", "vector(384)", "NOT NULL", "固定 384 維向量"], ["search_vector", "tsvector", "NOT NULL", "全文檢索詞彙及位置；供 Hybrid 相關度排名"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"]], "rules": ["UNIQUE(document_index_id, ordinal)。", "idx_chunks_search_vector USING gin(search_vector)；目前 migration 沒有 HNSW / IVFFlat 索引。", "向量相似度與 RAG Hybrid 全文匹配／排名各依 Obsidian CODING_STANDARDS.md 的限定 SQL 例外；不授權其他查詢。"]}, {"name": "document_relations", "title": "索引產生的文件關聯", "purpose": "關聯證據屬於 source_index；目標可先保留文字引用，解析完成後才填 target_document_id。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["source_index_id", "uuid", "NOT NULL · FK", "關聯來源 document_indexes.id"], ["target_document_id", "uuid", "NULL · FK", "已解析的 documents.id；未解析可為 NULL"], ["target_reference", "text", "NOT NULL", "原始目標文字引用"], ["target_anchor", "text", "NULL", "目標內的錨點"], ["relation_type", "text", "NOT NULL · CHECK", "markdown_link / wiki_link / references / requires / applies_to / overrides"], ["evidence_block_start", "integer", "NOT NULL · CHECK ≥ 0", "來源證據範圍起點"], ["evidence_block_end", "integer", "NOT NULL · CHECK > start", "來源證據範圍終點，不包含終點"], ["evidence_text", "text", "NOT NULL", "支持關聯的來源文字"]], "rules": ["idx_relations_source(source_index_id)。", "idx_relations_target(target_document_id) WHERE target_document_id IS NOT NULL。"]}, {"name": "jobs", "title": "Infrastructure 工作執行紀錄", "purpose": "保存尚待完成的持久化工作、租約與執行狀態；業務流程由 DocumentIndexes 的 Listener 承接。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["knowledge_base_id", "uuid", "NOT NULL · FK / 複合 FK", "工作所屬專案與成員"], ["document_id", "uuid", "NOT NULL · 複合 FK", "工作所屬文件"], ["document_index_id", "uuid", "NOT NULL · 複合 FK", "待建立或啟用的同文件索引"], ["generation", "bigint", "NOT NULL · CHECK > 0", "此工作對應的請求世代"], ["status", "text", "NOT NULL · CHECK", "queued / running"], ["attempts", "integer", "NOT NULL · DEFAULT 0 · CHECK 0…4", "已領取執行的次數；上限 4"], ["available_at", "timestamptz", "NOT NULL · DEFAULT now()", "最早可領取時間"], ["reserved_at", "timestamptz", "NULL · CHECK", "running 必須有值；queued 必須 NULL"], ["lease_token", "uuid", "NULL · CHECK", "running 必須有值；queued 必須 NULL"], ["lease_expires_at", "timestamptz", "NULL", "獨立租約到期欄；初始 migration 0008 建立；允許 NULL"], ["idempotency_key", "text", "UNIQUE · NULL", "非 NULL key 不得重複"], ["retry_of_failed_job_id", "uuid", "NULL · 複合 FK", "可參照失敗紀錄，現行重試寫入 NULL"], ["payload", "jsonb", "NOT NULL · CHECK object", "工作輸入"], ["execution_state", "jsonb", "NULL · CHECK object", "可選的執行進度或結果狀態"], ["execution_verification", "jsonb", "NULL · CHECK object", "running 租約驗證；含 claim_token 與 lease_expires_at 字串"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"], ["updated_at", "timestamptz", "NOT NULL · DEFAULT now()", "更新時間；後續更新由寫入端維護"]], "rules": ["UNIQUE(knowledge_base_id, document_id)：每個成員最多一筆未完成工作。", "FK(knowledge_base_id, document_id) → knowledge_base_documents；FK(document_id, document_index_id) → document_indexes。", "重試複合 FK(knowledge_base_id, document_id, document_index_id, retry_of_failed_job_id) → failed_jobs 同專案、文件、索引的紀錄。", "queued：attempts < 4，reserved_at / lease_token / execution_verification 為 NULL；running：attempts 1…4，三欄均非 NULL。", "execution_verification 的 CHECK 僅驗證 object 與兩個字串欄位；不驗證字串是有效 UUID / 日期，也不保證它們等於獨立租約欄位。", "lease_expires_at 不在原 lease-state CHECK 中；初始 migration 0008 建立此 nullable 欄位及 recovery index；執行端寫入到期時間，缺漏值由回收流程處理。", "idx_jobs_claim(available_at, created_at) WHERE status = queued。", "idx_jobs_recovery(reserved_at) WHERE status = running；idx_jobs_document_index(document_index_id)。", "idx_jobs_retry_failed(retry_of_failed_job_id) WHERE retry_of_failed_job_id IS NOT NULL。", "idx_jobs_status_lease_expiry(status, lease_expires_at, created_at, id)。"]}, {"name": "failed_jobs", "title": "Infrastructure 最終失敗紀錄", "purpose": "封存已達執行上限的失敗與重試輸入，供人工重試使用。成功排入重試工作時移除原失敗紀錄。", "fields": [["id", "uuid", "PK · DEFAULT gen_random_uuid()", "資料列識別碼"], ["job_id", "uuid", "UNIQUE · NOT NULL · 無 FK", "原工作識別；原 jobs 列會刪除"], ["knowledge_base_id", "uuid", "NOT NULL · FK", "失敗所屬 knowledge_bases.id"], ["document_id", "uuid", "NOT NULL · 複合 FK", "原工作所屬文件"], ["document_index_id", "uuid", "NOT NULL · 複合 FK", "原工作所屬索引"], ["generation", "bigint", "NOT NULL · CHECK > 0", "失敗工作對應世代"], ["attempts", "integer", "NOT NULL · CHECK = 4", "封存時已達 4 次執行"], ["error_code", "text", "NULL", "失敗分類"], ["error_message", "text", "NULL", "失敗說明"], ["blocked_reasons", "jsonb", "NOT NULL · DEFAULT [] · CHECK array", "阻塞原因列表"], ["retry_payload", "jsonb", "NOT NULL · CHECK object", "重新派送所需輸入"], ["failed_at", "timestamptz", "NOT NULL · DEFAULT now()", "最終失敗時間"], ["retried_at", "timestamptz", "NULL", "可記錄重試時間，現行重試刪除此列"], ["created_at", "timestamptz", "NOT NULL · DEFAULT now()", "建立時間"], ["updated_at", "timestamptz", "NOT NULL · DEFAULT now()", "更新時間；後續更新由寫入端維護"]], "rules": ["UNIQUE(job_id)；沒有 job_id → jobs.id 的實體 FK。Model 的邏輯關聯不改變此事實。", "FK(document_id, document_index_id) → document_indexes(document_id, id)。", "UNIQUE(knowledge_base_id, document_id, document_index_id, id) 支援 jobs 的同範圍重試 FK。", "idx_failed_jobs_lookup(knowledge_base_id, document_id, failed_at DESC)。", "idx_failed_jobs_document_index(document_index_id)。"]}, {"name": "document_index_success_receipts", "title": "Infrastructure 成功工作收據", "purpose": "保留已完成工作的歷史目標與專案識別，供刪除 queue job 後查詢狀態；不代表目標索引仍為目前啟用版本。", "fields": [["job_id", "uuid", "PK", "原工作識別；原 jobs 列會刪除"], ["project_id", "text", "NOT NULL", "完成時的外部專案識別；保留歷史查詢範圍"], ["knowledge_base_id", "uuid", "NOT NULL", "完成時的知識庫識別"], ["document_id", "uuid", "NOT NULL", "原工作所屬文件"], ["document_index_id", "uuid", "NOT NULL", "原工作完成的索引"], ["generation", "bigint", "NOT NULL · CHECK > 0", "原工作對應世代"], ["attempts", "integer", "NOT NULL · CHECK 0…4", "成功時已領取執行的次數"], ["execution_verification", "jsonb", "NULL", "原工作執行驗證"], ["completed_at", "timestamptz", "NOT NULL", "成功收據寫入時間"]], "rules": ["job_id 為主鍵；無其他唯一鍵、FK 或額外索引，避免歷史收據阻擋業務資料清理。", "各欄位由成功 Listener 的同一交易寫入；不從任意 ready index 推定或回填過去已刪除的工作。", "migration 0014 為 forward-only，down 保留成功收據；收據的清理期限尚未定義。"]}], "architecture": ["project_id → knowledge_bases → knowledge_base_documents → active_document_index_id → chunks / document_relations。", "documents 與 revisions / indexes 跨專案共用；每個專案成員各自維護有效索引與 requested_generation。", "jobs / failed_jobs 是 Infrastructure 的 JobModel / FailedJobModel 技術紀錄；document_index_success_receipts 保存成功工作的技術收據，不建立 Domain Job Entity 或 Application/Jobs feature。", "業務事件與 Listeners 位於各自 owning feature 的 `Application/Events`、`Application/Listeners`；文件索引工作派送、執行、成功、失敗與重試由 `DocumentIndexes` 負責，Worker 位於 `DocumentIndexes/Interfaces/Console/Workers`。", "DocumentIndexExecutionQueue / DocumentIndexFailureArchive / DocumentIndexSuccessArchive 抽象位於 `DocumentIndexes/Application/Ports/Out/Gateways`；ChunkPlanningProvider 位於 `Chunks/Application/Ports/Out/Gateways`。"], "workflow": ["索引就緒後，Listener 驗證成員的最新 requested_generation 與索引資格，再切換該成員的 active_document_index_id；不宣稱整個專案一次原子切換。", "queued 領取後進入 running 並建立租約；執行次數從 1 到 4，亦即首次執行加最多 3 次自動重試。", "前 3 次失敗重新排程同一 jobs.id；第 4 次最終失敗以交易封存 failed_jobs 並移除 jobs；成功啟用時在同一交易寫入成功收據及移除 jobs。", "成功收據保存當時 project_id 及工作目標，允許完成後繼續查詢狀態；後續世代與成員移除不改寫歷史成功。尚未定義收據清理期限，需評估持續累積的容量。", "人工重試在同一交易建立新工作並刪除原 failed_jobs 紀錄。新工作的 attempts 為 0，retry_of_failed_job_id 寫入 NULL，API 回應包含原失敗紀錄 ID。", "持久化派送、交易提交後交付、租約驗證、冪等與重試需由流程共同維護；FK / CHECK 本身不保證整個工作流程完成。"], "constraints": ["本圖以 migration 的實體 schema 為準，包含 10 表、104 欄、14 組 FK；所有 FK 的刪除行為皆為 RESTRICT。", "PK / UNIQUE 由 PostgreSQL 建立對應索引；下方另列 migration 明確宣告的一般與部分索引。", "TypeORM Model 關聯不等同實體 FK；DataSource synchronize: false，schema 變更透過 migration。", "DateTime / SourceLineRange 是 Domain Value Object，格式轉換與來源範圍驗證不新增獨立資料表；時間欄位維持 timestamptz。", "這是程式定義稽核，未連線驗證任何環境的已套用 migration 或資料；也不代表搜尋功能與部署驗收已完成。"], "sources": [["DataSource 註冊的 migrations 和 TypeORM Models", "../../src/Bootstrap/Persistence/TypeORM/DataSource.ts"], ["Markdown 欄位、約束與原始碼索引", "rag-database-schema.md"]]}</script>
<script>
const data=JSON.parse(document.getElementById('schema-data').textContent);
const schema=data.tables, edges=[{"source": "knowledge_base_documents", "columns": ["knowledge_base_id"], "target": "knowledge_bases", "targetColumns": ["id"], "physical": true}, {"source": "jobs", "columns": ["knowledge_base_id"], "target": "knowledge_bases", "targetColumns": ["id"], "physical": true}, {"source": "failed_jobs", "columns": ["knowledge_base_id"], "target": "knowledge_bases", "targetColumns": ["id"], "physical": true}, {"source": "knowledge_base_documents", "columns": ["document_id"], "target": "documents", "targetColumns": ["id"], "physical": true}, {"source": "knowledge_base_documents", "columns": ["document_id", "active_document_index_id"], "target": "document_indexes", "targetColumns": ["document_id", "id"], "physical": true}, {"source": "document_revisions", "columns": ["document_id"], "target": "documents", "targetColumns": ["id"], "physical": true}, {"source": "document_indexes", "columns": ["document_id", "revision_id"], "target": "document_revisions", "targetColumns": ["document_id", "id"], "physical": true}, {"source": "chunks", "columns": ["document_index_id"], "target": "document_indexes", "targetColumns": ["id"], "physical": true}, {"source": "document_relations", "columns": ["source_index_id"], "target": "document_indexes", "targetColumns": ["id"], "physical": true}, {"source": "document_relations", "columns": ["target_document_id"], "target": "documents", "targetColumns": ["id"], "physical": true}, {"source": "jobs", "columns": ["knowledge_base_id", "document_id"], "target": "knowledge_base_documents", "targetColumns": ["knowledge_base_id", "document_id"], "physical": true}, {"source": "jobs", "columns": ["document_id", "document_index_id"], "target": "document_indexes", "targetColumns": ["document_id", "id"], "physical": true}, {"source": "jobs", "columns": ["knowledge_base_id", "document_id", "document_index_id", "retry_of_failed_job_id"], "target": "failed_jobs", "targetColumns": ["knowledge_base_id", "document_id", "document_index_id", "id"], "physical": true}, {"source": "failed_jobs", "columns": ["document_id", "document_index_id"], "target": "document_indexes", "targetColumns": ["document_id", "id"], "physical": true}];
const selectElement = selector => document.querySelector(selector);
const tableCards = [...document.querySelectorAll('.table')];
const relationshipPaths = [...document.querySelectorAll('.edge')];

const initialDetails = selectElement('#details').innerHTML;

const resetDetails = () => {
 tableCards.forEach(tableCard => tableCard.classList.remove('dim', 'selected'));
 relationshipPaths.forEach(relationshipPath => relationshipPath.classList.remove('dim', 'selected'));
 selectElement('#details').innerHTML = initialDetails;
 selectElement('#tables').value = '';
 selectElement('#search').value = '';
 document.querySelectorAll('.relation-row').forEach(row => { row.hidden = false });
};
selectElement('#reset').onclick = resetDetails;
const appendTextElement = (parent, elementTag, displayText) => {
 const createdElement = document.createElement(elementTag);
 createdElement.textContent = displayText;
 parent.append(createdElement);
 return createdElement;
};

const appendColumnPair = (parent, source, target) => {
 const pair = appendTextElement(parent, 'div', '');
 pair.className = 'column-pair';
 appendTextElement(pair, 'code', source);
 appendTextElement(pair, 'span', '→');
 appendTextElement(pair, 'code', target);
};
const appendDisclosure = (parent, label) => {
 const section = appendTextElement(parent, 'details', '');
 appendTextElement(section, 'summary', label);
 return section;
};

const selectTable = (tableName, scrollToTable = false) => {
 const relatedEdges = edges.filter(relationship => relationship.source === tableName || relationship.target === tableName);
 const relatedTableNames = new Set([tableName, ...relatedEdges.flatMap(relationship => [relationship.source, relationship.target])]);
 tableCards.forEach(tableCard => {
  tableCard.classList.toggle('dim', !relatedTableNames.has(tableCard.dataset.name));
  tableCard.classList.toggle('selected', tableCard.dataset.name === tableName);
 });
 relationshipPaths.forEach(relationshipPath => {
  const isActiveRelationship = relationshipPath.dataset.source === tableName || relationshipPath.dataset.target === tableName;
  relationshipPath.classList.toggle('dim', !isActiveRelationship);
  relationshipPath.classList.toggle('selected', isActiveRelationship);
 });
 selectElement('#tables').value = tableName;
 const detailsPanel = selectElement('#details');
 const selectedTable = schema.find(tableDefinition => tableDefinition.name === tableName);
 detailsPanel.replaceChildren();
 appendTextElement(detailsPanel, 'h2', tableName);
 appendTextElement(detailsPanel, 'p', selectedTable.title);
 appendTextElement(detailsPanel, 'p', selectedTable.purpose);
 appendTextElement(detailsPanel, 'p', `${selectedTable.fields.length} 欄位 · ${relatedEdges.length} 組實體 FK`);
 for (const outgoing of [true, false]) {
  const direction = outgoing ? '此表參照' : '參照此表';
  const group = relatedEdges.filter(edge => (outgoing ? edge.source : edge.target) === tableName);
  if (!group.length) continue;
  appendTextElement(detailsPanel, 'h3', direction);
  for (const edge of group) {
   const neighbor = outgoing ? edge.target : edge.source;
   const relation = appendTextElement(detailsPanel, 'div', '');
   relation.className = 'relation-detail';
   const jump = appendTextElement(relation, 'button', neighbor);
   jump.onclick = () => selectTable(neighbor, true);
   edge.columns.forEach((column, i) => appendColumnPair(relation, column, edge.targetColumns[i]));
  }
 }
 if (!relatedEdges.length) appendTextElement(detailsPanel, 'p', '此表沒有實體外鍵關聯。');
 const rules = appendDisclosure(detailsPanel, '資料約束（' + selectedTable.rules.length + '）');
 selectedTable.rules.forEach(rule => appendTextElement(rules, 'p', rule));
 const fields = appendDisclosure(detailsPanel, '完整欄位（' + selectedTable.fields.length + '）');
 selectedTable.fields.forEach(([fieldName, fieldType, constraint, note]) => {
  const entry = appendTextElement(fields, 'div', '');
  entry.className = 'field-entry';
  appendTextElement(entry, 'h4', fieldName);
  appendTextElement(entry, 'small', `${fieldType} · ${constraint}`);
  appendTextElement(entry, 'p', note);
 });
 if (scrollToTable || matchMedia('(max-width: 1080px)').matches) {
  detailsPanel.scrollIntoView({block: 'nearest'});
 }
};

[...schema].sort((leftTable, rightTable) => leftTable.name.localeCompare(rightTable.name)).forEach(tableDefinition => {
 const tableOption = document.createElement('option');
 tableOption.value = tableDefinition.name;
 tableOption.textContent = tableDefinition.name;
 selectElement('#tables').append(tableOption);
});
selectElement('#tables').onchange = event => {
 if (event.target.value) selectTable(event.target.value, true);
};
relationshipPaths.forEach(cell => {
 const showRelationship = () => {
  const {source, target} = cell.dataset;
  selectTable(source);
  const edge = edges.find(item => item.source === source && item.target === target);
  const panel = selectElement('#details');
  panel.replaceChildren();
  appendTextElement(panel, 'h2', edge.columns.length > 1 ? '複合外鍵' : '單欄外鍵');
  appendTextElement(panel, 'h3', source + ' → ' + target);
  edge.columns.forEach((column, i) => appendColumnPair(panel, column, edge.targetColumns[i]));
  appendTextElement(panel, 'p', 'ON DELETE RESTRICT');
  for (const name of [source, target]) {
   appendTextElement(panel, 'button', name).onclick = () => selectTable(name, true);
  }
  relationshipPaths.forEach(other => {
   other.classList.toggle('dim', other !== cell);
   other.classList.toggle('selected', other === cell);
  });
  if (matchMedia('(max-width: 1080px)').matches) panel.scrollIntoView({block: 'nearest'});
 };
 cell.onclick = showRelationship;
 cell.onkeydown = event => {
  if (event.key === 'Enter' || event.key === ' ') {
   event.preventDefault();
   showRelationship();
  }
 };
});
tableCards.forEach(tableCard => {
 tableCard.onclick = () => selectTable(tableCard.dataset.name);
 tableCard.onkeydown = event => {
  if (event.key === 'Enter' || event.key === ' ') {
   event.preventDefault();
   selectTable(tableCard.dataset.name);
  }
 };
});
selectElement('#search').oninput = event => {
 const searchQuery = event.target.value.trim().toLowerCase();
 if (!searchQuery) {
  resetDetails();
  return;
 }
 const matchingTableNames = new Set(schema.filter(tableDefinition => [tableDefinition.name, tableDefinition.title, tableDefinition.purpose, ...tableDefinition.fields.flat()].some(value => value.toLowerCase().includes(searchQuery))).map(tableDefinition => tableDefinition.name));
 tableCards.forEach(tableCard => {
  tableCard.classList.toggle('dim', !matchingTableNames.has(tableCard.dataset.name));
  tableCard.classList.remove('selected');
 });
 relationshipPaths.forEach(relationshipPath => {
  relationshipPath.classList.add('dim');
  relationshipPath.classList.remove('selected');
 });
 selectElement('#tables').value = '';
 const detailsPanel = selectElement('#details');
 detailsPanel.replaceChildren();
 appendTextElement(detailsPanel, 'p', `找到 ${matchingTableNames.size} 張符合「${searchQuery}」的表`);
 document.querySelectorAll('.relation-row').forEach(row => { row.hidden = !matchingTableNames.has(row.dataset.name) });
 matchingTableNames.forEach(tableName => {
  const resultButton = appendTextElement(detailsPanel, 'button', tableName);
  resultButton.style.marginBottom = '8px';
  resultButton.onclick = () => selectTable(tableName, true);
  detailsPanel.append(document.createElement('br'));
 });
};
const compact = selectElement('#compact');
for (const table of schema) {
 const row = document.createElement('div');
 row.className = 'relation-row';
 row.dataset.name = table.name;
 compact.append(row);
 const title = appendTextElement(row, 'button', table.title);
 title.onclick = () => selectTable(table.name, true);
 appendTextElement(row, 'small', table.name);
 const outgoing = relationshipPaths.filter(cell => cell.dataset.source === table.name);
 const targets = appendTextElement(row, 'div', outgoing.length ? '參照' : '沒有向外參照的外鍵');
 targets.className = 'targets';
 for (const cell of outgoing) {
  const target = schema.find(item => item.name === cell.dataset.target);
  appendTextElement(targets, 'button', target.title).onclick = () => cell.onclick();
 }
}
</script>
</html>
