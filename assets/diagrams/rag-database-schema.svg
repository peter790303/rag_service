<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="726" viewBox="0 0 1040 726" role="img" aria-labelledby="title desc">
<title id="title">RAG 資料表外鍵關聯矩陣</title><desc id="desc">由左側的資料表向右讀。圓點標出外鍵目標，菱形表示複合外鍵。</desc>
