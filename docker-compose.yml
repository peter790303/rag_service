services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agent_teams_rag
    ports:
      - '127.0.0.1:30684:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d agent_teams_rag']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rag_data:/var/lib/postgresql/data
  migrate:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/agent_teams_rag
    command: ['npm', 'run', 'migration:run']
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/agent_teams_rag
      PORT: 30700
    command: ['node', 'dist/src/main.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:30682:30700'
  worker:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/agent_teams_rag
    command: ['node', 'dist/src/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  rag_data:
