services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    ports:
      - '127.0.0.1:30684:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rag_data:/var/lib/postgresql/data
  migrate:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: '${RAG_DATABASE_URL}'
    command: ['npm', 'run', 'migration:run']
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: '${RAG_DATABASE_URL}'
      RAG_DB_SCHEMA: '${RAG_DB_SCHEMA}'
      PORT: '${PORT}'
      RAG_EMBEDDING_TRANSPORT: '${RAG_EMBEDDING_TRANSPORT}'
      RAG_EMBEDDING_API_URL: '${RAG_EMBEDDING_API_URL}'
      RAG_EMBEDDING_MODEL: '${RAG_EMBEDDING_MODEL}'
      RAG_EMBEDDING_REVISION: '${RAG_EMBEDDING_REVISION}'
      RAG_EMBEDDING_CACHE_DIR: '${RAG_EMBEDDING_CACHE_DIR}'
      RAG_EMBEDDING_DIMENSIONS: '${RAG_EMBEDDING_DIMENSIONS}'
      RAG_CHUNKING_TRANSPORT: '${RAG_CHUNKING_TRANSPORT}'
      RAG_CHUNKING_API_URL: '${RAG_CHUNKING_API_URL}'
      RAG_CHUNKING_MODEL: '${RAG_CHUNKING_MODEL}'
      RAG_SERVICE_AUTH_SECRET: '${RAG_SERVICE_AUTH_SECRET}'
      RAG_EXTERNAL_REQUEST_TIMEOUT_MS: '${RAG_EXTERNAL_REQUEST_TIMEOUT_MS}'
      RAG_JOB_LEASE_SECONDS: '${RAG_JOB_LEASE_SECONDS}'
      RAG_WORKER_POLL_MS: '${RAG_WORKER_POLL_MS}'
    command: ['node', 'dist/src/main.js']
    volumes:
      - '${RAG_EMBEDDING_CACHE_DIR}:${RAG_EMBEDDING_CACHE_DIR}:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:30682:30700'
  worker:
    build: .
    env_file: .env
    environment:
      RAG_DATABASE_URL: '${RAG_DATABASE_URL}'
      RAG_DB_SCHEMA: '${RAG_DB_SCHEMA}'
      RAG_EMBEDDING_TRANSPORT: '${RAG_EMBEDDING_TRANSPORT}'
      RAG_EMBEDDING_API_URL: '${RAG_EMBEDDING_API_URL}'
      RAG_EMBEDDING_MODEL: '${RAG_EMBEDDING_MODEL}'
      RAG_EMBEDDING_REVISION: '${RAG_EMBEDDING_REVISION}'
      RAG_EMBEDDING_CACHE_DIR: '${RAG_EMBEDDING_CACHE_DIR}'
      RAG_EMBEDDING_DIMENSIONS: '${RAG_EMBEDDING_DIMENSIONS}'
      RAG_CHUNKING_TRANSPORT: '${RAG_CHUNKING_TRANSPORT}'
      RAG_CHUNKING_API_URL: '${RAG_CHUNKING_API_URL}'
      RAG_CHUNKING_MODEL: '${RAG_CHUNKING_MODEL}'
      RAG_SERVICE_AUTH_SECRET: '${RAG_SERVICE_AUTH_SECRET}'
      RAG_EXTERNAL_REQUEST_TIMEOUT_MS: '${RAG_EXTERNAL_REQUEST_TIMEOUT_MS}'
      RAG_JOB_LEASE_SECONDS: '${RAG_JOB_LEASE_SECONDS}'
      RAG_WORKER_POLL_MS: '${RAG_WORKER_POLL_MS}'
    command: ['node', 'dist/src/worker.js']
    volumes:
      - '${RAG_EMBEDDING_CACHE_DIR}:${RAG_EMBEDDING_CACHE_DIR}:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  rag_data:
