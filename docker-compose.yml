services:
  database:
    restart: always
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: '${DATABASE_USER}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
      POSTGRES_DB: '${DATABASE_NAME}'
    ports:
      - '127.0.0.1:30684:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rag_data:/var/lib/postgresql/data
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: '${DATABASE_NAME}'
      DATABASE_USER: '${DATABASE_USER}'
      DATABASE_PASSWORD: '${DATABASE_PASSWORD}'
      DATABASE_SCHEMA: '${DATABASE_SCHEMA:-public}'
    command: ['npm', 'run', 'migration:run']
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      database:
        condition: service_healthy
  api:
    restart: always
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: '${DATABASE_NAME}'
      DATABASE_USER: '${DATABASE_USER}'
      DATABASE_PASSWORD: '${DATABASE_PASSWORD}'
      DATABASE_SCHEMA: '${DATABASE_SCHEMA:-public}'
      PORT: '${PORT}'
      RAG_BIND_ADDRESS: '0.0.0.0'
      OBSIDIAN_ROOT: '${OBSIDIAN_ROOT:-/Users/xiang/Documents/Worker}'
      RAG_EMBEDDING_TRANSPORT: '${RAG_EMBEDDING_TRANSPORT}'
      RAG_EMBEDDING_API_URL: '${RAG_EMBEDDING_API_URL}'
      RAG_EMBEDDING_MODEL: '${RAG_EMBEDDING_MODEL}'
      RAG_EMBEDDING_REVISION: '${RAG_EMBEDDING_REVISION}'
      RAG_EMBEDDING_CACHE_DIR: '${RAG_EMBEDDING_CACHE_DIR}'
      RAG_EMBEDDING_DIMENSIONS: '${RAG_EMBEDDING_DIMENSIONS}'
      RAG_CHUNKING_TRANSPORT: '${RAG_CHUNKING_TRANSPORT}'
      RAG_CHUNKING_API_URL: '${RAG_CHUNKING_API_URL}'
      RAG_CHUNKING_MODEL: '${RAG_CHUNKING_MODEL}'
      RAG_SERVICE_AUTH_SECRET: '${RAG_SERVICE_AUTH_SECRET}'
      RAG_EXTERNAL_REQUEST_TIMEOUT_MS: '${RAG_EXTERNAL_REQUEST_TIMEOUT_MS}'
      RAG_JOB_LEASE_SECONDS: '${RAG_JOB_LEASE_SECONDS}'
      RAG_WORKER_POLL_MS: '${RAG_WORKER_POLL_MS}'
    command: ['node', 'dist/src/main.js']
    volumes:
      - ./.env:/app/.env:ro
      - '${RAG_EMBEDDING_CACHE_DIR}:${RAG_EMBEDDING_CACHE_DIR}:ro'
      - '${OBSIDIAN_ROOT:-/Users/xiang/Documents/Worker}:${OBSIDIAN_ROOT:-/Users/xiang/Documents/Worker}:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:30682:30700'
  worker:
    restart: always
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: '${DATABASE_NAME}'
      DATABASE_USER: '${DATABASE_USER}'
      DATABASE_PASSWORD: '${DATABASE_PASSWORD}'
      DATABASE_SCHEMA: '${DATABASE_SCHEMA:-public}'
      RAG_EMBEDDING_TRANSPORT: '${RAG_EMBEDDING_TRANSPORT}'
      RAG_EMBEDDING_API_URL: '${RAG_EMBEDDING_API_URL}'
      RAG_EMBEDDING_MODEL: '${RAG_EMBEDDING_MODEL}'
      RAG_EMBEDDING_REVISION: '${RAG_EMBEDDING_REVISION}'
      RAG_EMBEDDING_CACHE_DIR: '${RAG_EMBEDDING_CACHE_DIR}'
      RAG_EMBEDDING_DIMENSIONS: '${RAG_EMBEDDING_DIMENSIONS}'
      RAG_CHUNKING_TRANSPORT: '${RAG_CHUNKING_TRANSPORT}'
      RAG_HOST_CLI_URL: 'http://host.docker.internal:${RAG_HOST_CLI_PORT:-30701}/internal/chunk-planning'
      RAG_HOST_CLI_SHARED_SECRET: '${RAG_HOST_CLI_SHARED_SECRET}'
      RAG_CHUNKING_API_URL: '${RAG_CHUNKING_API_URL}'
      RAG_CHUNKING_MODEL: '${RAG_CHUNKING_MODEL}'
      RAG_SERVICE_AUTH_SECRET: '${RAG_SERVICE_AUTH_SECRET}'
      RAG_EXTERNAL_REQUEST_TIMEOUT_MS: '${RAG_EXTERNAL_REQUEST_TIMEOUT_MS}'
      RAG_JOB_LEASE_SECONDS: '${RAG_JOB_LEASE_SECONDS}'
      RAG_WORKER_POLL_MS: '${RAG_WORKER_POLL_MS}'
    command: ['node', 'dist/src/worker.js']
    volumes:
      - ./.env:/app/.env:ro
      - '${RAG_EMBEDDING_CACHE_DIR}:${RAG_EMBEDDING_CACHE_DIR}:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  rag_data:
